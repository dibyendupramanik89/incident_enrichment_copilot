[project]
name = "incident_enrichment_copilot"
version = "0.1.0"
description = "Incident & Ticket Enrichment Copilot — MCP + ChromaDB RAG + HITL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.1",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "gradio>=4.0.0",
    "requests>=2.31.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/example/incident_enrichment_copilot"

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

